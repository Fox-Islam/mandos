name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHON: python
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: orchestrator/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestrator/requirements-dev.txt

      - name: Ruff lint
        run: ruff check orchestrator

      - name: Ruff format check
        run: ruff format --check orchestrator

      - name: Compile sources
        run: python -m compileall orchestrator -q

      - name: Test
        run: python -m pytest

      - name: Smoke (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/smoke.sh

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/smoke.ps1
