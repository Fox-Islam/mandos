# The judge. `shape` decides what does the judging:
#   hybrid  an analyst proposes claims, Jev decides them (the default)
#   matrix  Jev alone -- pairwise agreement and per-answer rubrics, no analyst
#   verify  the analyst writes the analysis, Jev grades each finding
#   llm     the generative analyst alone, uncalibrated
# Every shape but `llm` calls Jev and falls back to the analyst if Jev cannot
# deliver. `api_key_env` is left unset so it follows `provider`.
judge:
  shape: hybrid
  provider: typesafe          # or: openrouter
  model: jev-latest
  # base_url: https://jev.internal    # self-hosted or proxied endpoint
  # api_key_env: MY_JEV_KEY           # default: TYPESAFE_API_KEY / OPENROUTER_API_KEY
  timeout_s: 30
  max_retries: 2
  questions_per_call: 60

defaults:
  preset: quality
  # The generative analyst: proposes claims for `hybrid`, writes the analysis for
  # `verify` and `llm`, and is the fallback whenever Jev is unreachable.
  analysis_model: local
  timeout_s: 90
  max_depth: 1
  max_tokens: 4096
  analysis_max_tokens: 8192
  budget_warning_ratio: 0.75
  budget_error_ratio: 0.90
  session_max_turns: 12
  # Prune sessions untouched for this long; 0 keeps them forever.
  session_max_age_days: 30

# What the panel is told about the conversation so far. Needs the capture hook
# (scripts/hooks/capture_transcript.py); without it there is nothing to read.
context:
  from_transcript: true
  max_turns: 12
  max_chars: 24000
  max_age_s: 3600

providers:
  - id: local
    kind: openai
    catalog_key: vllm
    base_url: http://dgx-spark-01:8000/v1
    model: <a-strong-large-context-local-model>
    context_window: 131072
    roles: [panel, judge]
    timeout_s: 120
    max_retries: 1

  - id: minimax
    kind: openai
    base_url: https://api.minimax.io/v1
    model: MiniMax-M2-...
    api_key_env: MINIMAX_API_KEY
    roles: [panel]

  - id: deepseek
    kind: openai
    catalog_key: deepseek
    base_url: https://api.deepseek.com/v1
    model: deepseek-reasoner
    resolved_context_window: 64000
    context_window_source: modelsdev
    api_key_env: DEEPSEEK_API_KEY
    roles: [panel]

  - id: or-gemini
    kind: openrouter
    base_url: https://openrouter.ai/api/v1
    model: google/gemini-2.5-pro
    api_key_env: OPENROUTER_API_KEY
    # OpenRouter calls are labelled "Mandos" automatically; set X-Title here only to
    # override it for this provider.
    roles: [panel]
    # Tools the *provider* runs. A client-executed "function" tool is refused at load:
    # local data reaches the panel by the calling model gathering it into `context`,
    # where the harness's permission prompts still apply.
    tools:
      - { type: "openrouter:web_search" }
      - { type: "openrouter:web_fetch" }
    max_tool_calls: 4

presets:
  quality:    { panel: [local, minimax, deepseek, or-gemini], analysis: local }
  local-only: { panel: [local], analysis: local }

# Optional. Prices come from the model catalog when a provider is not listed here,
# so this block is for overriding what the catalog says, not for filling it in.
pricing:
  deepseek:  { in: 0.27, out: 1.10 }
  or-gemini: { in: 1.25, out: 5.00 }
